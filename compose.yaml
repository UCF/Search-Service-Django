# Runs the container image against PostgreSQL for local development.
# See "Running in a container" in the README.

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: search
      POSTGRES_USER: search
      POSTGRES_PASSWORD: search
    # The 18 image keeps its data in a versioned folder under
    # /var/lib/postgresql and refuses a volume at .../data. The volume
    # name changed with it, so an old PostgreSQL 17 volume isn't reused.
    volumes:
      - db-data-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "search"]
      interval: 5s
      retries: 20

  web:
    build: .
    environment:
      SECRET_KEY: local-development-only
      DEBUG: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: search
      DB_USER: search
      DB_PASSWORD: search
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data-18:
