name: Tests

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.8 / ${{ matrix.database.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        database:
          # Production today
          - name: MySQL 5.7
            image: mysql:5.7
            engine: django.db.backends.mysql
            user: root
            port: 3306
            health: mysqladmin ping -h 127.0.0.1 -pci
          # Production after the move to Azure
          - name: PostgreSQL 17
            image: postgres:17
            engine: django.db.backends.postgresql
            user: postgres
            port: 5432
            health: pg_isready -U postgres

    services:
      db:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: search
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: search
        ports:
          - ${{ matrix.database.port }}:${{ matrix.database.port }}
        options: >-
          --health-cmd "${{ matrix.database.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SECRET_KEY: ci
      DB_ENGINE: ${{ matrix.database.engine }}
      DB_NAME: search
      DB_USER: ${{ matrix.database.user }}
      DB_PASSWORD: ci
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.database.port }}

    steps:
      - uses: actions/checkout@v4

      # mysqlclient compiles against the MySQL client libraries
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev pkg-config

      # uv takes the Python version from .python-version (3.8, matching
      # production), so that file is the one place to change it.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-install-project --extra postgres

      - name: Configure settings
        run: |
          cp settings_local.tmpl.py settings_local.py
          cat docker/env-settings.py >> settings_local.py

      - name: Run tests
        run: uv run --no-sync python manage.py test

  image:
    name: Container image
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: search
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SECRET_KEY: ci
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: search
      DB_USER: postgres
      DB_PASSWORD: ci
      DB_HOST: 127.0.0.1
      DB_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t search-service:ci .

      # Runs the image the way App Service will: migrate, then serve with
      # gunicorn, and check that the API answers.
      - name: Migrate and serve
        run: |
          ENV_ARGS="-e SECRET_KEY -e ALLOWED_HOSTS -e DB_ENGINE -e DB_NAME -e DB_USER -e DB_PASSWORD -e DB_HOST -e DB_PORT"
          docker run --rm --network host $ENV_ARGS search-service:ci python manage.py migrate --noinput
          docker run -d --name web --network host $ENV_ARGS search-service:ci
          for attempt in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/api/v1/programs/ && exit 0
            sleep 1
          done
          docker logs web
          exit 1
